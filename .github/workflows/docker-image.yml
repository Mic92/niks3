name: Build Docker Image
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Create Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            # The Helm chart's appVersion is the git tag. The semver patterns below
            # drop the v prefix for prereleases.
            type=ref,event=tag
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
      - name: Setup Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-substituters = https://cache.thalheim.io
            extra-trusted-public-keys = cache.thalheim.io-1:R7msbosLEZKrxk/lKxf9BTjOOH7Ax3H0Qj0/6wiHOgc=
      - name: Build Docker image
        run: |
          nix build .#niks3-docker --print-build-logs
      - name: Push images
        env:
          REGCTL_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -xve
          PATH="$(nix build --inputs-from . nixpkgs#regctl --print-out-paths --no-link)/bin:$PATH"
          regctl registry login "$REGISTRY" -u "${{ github.actor }}" --pass-stdin <<< "$REGCTL_PASSWORD"
          regctl image import "ocidir://local:niks3" ./result
          for tag in $(echo '${{ steps.meta.outputs.tags }}' | tr ' ' '\n'); do
            regctl image copy "ocidir://local:niks3" "$tag"
          done
  # GHCR stores the per-arch children of a multi-arch index as untagged
  # versions. A naive "delete untagged" (actions/delete-package-versions) broke
  # every release tag once already (#291). ghcr-cleanup-action walks the index
  # manifests and only deletes children together with their last parent.
  cleanup:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: ghcr-cleanup
    permissions:
      packages: write
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          package: niks3
          exclude-tags: "v*,main,latest"
          # Legacy per-commit tags from when metadata-action emitted type=sha.
          delete-tags: "sha-*"
          keep-n-untagged: 5
          # regctl pushes children before the index; don't race an in-flight push.
          older-than: 1 day
          validate: true
