name: Release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-substituters = https://cache.thalheim.io
            extra-trusted-public-keys = cache.thalheim.io-1:R7msbosLEZKrxk/lKxf9BTjOOH7Ax3H0Qj0/6wiHOgc=
      - name: Run GoReleaser
        run: nix shell --inputs-from . nixpkgs#goreleaser --command goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # checksums.txt lists every archive, so one attestation covers them all.
      - name: Attest release archives
        uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: dist/checksums.txt
  helm-chart:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - name: Publish chart
        run: |
          version="${GITHUB_REF_NAME#v}"
          helm package deploy/helm/niks3 --version "$version" --app-version "$GITHUB_REF_NAME"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "niks3-$version.tgz" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"
  # niks3-action pins a niks3 release and downloads its assets at runtime, so
  # only ask it to bump once goreleaser has uploaded them.
  update-action:
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: niks3-action
          permission-actions: write
      - name: Trigger niks3-action update
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh workflow run update-niks3.yml -R "$GITHUB_REPOSITORY_OWNER/niks3-action"
