{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  {{- /* The suffix keeps this apart from the PodDisruptionBudget that a
       CloudNativePG Cluster named like the release manages under the bare
       name. CloudNativePG would delete this one otherwise. */}}
  name: {{ include "niks3.fullname" . }}-server
  labels: {{- include "niks3.labels" . | nindent 4 }}
spec:
  {{- with .Values.podDisruptionBudget.minAvailable }}
  {{- if ge (int .) (int $.Values.replicaCount) }}
  {{- fail "podDisruptionBudget.minAvailable must be below replicaCount, otherwise node drains block forever" }}
  {{- end }}
  minAvailable: {{ . }}
  {{- else }}
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  {{- end }}
  selector:
    matchLabels: {{- include "niks3.serverSelectorLabels" . | nindent 6 }}
{{- end }}
